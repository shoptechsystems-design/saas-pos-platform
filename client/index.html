  <body>

    <script>
      // Analytics is optional: only load it when the env vars are configured.
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!endpoint || endpoint.indexOf("%") !== -1) return;
        var el = document.createElement("script");
        el.defer = true;
        el.src = endpoint + "/umami";
        el.setAttribute("data-website-id", websiteId);
        document.body.appendChild(el);
      })();
    </script>
  </body>
